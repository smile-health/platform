name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '26'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wms-encore's lint is `tsc --noEmit` against types the Encore CLI
      # generates; it is checked by `encore build` in Build & Deploy instead.
      - name: Run linter
        run: pnpm turbo lint --filter='!@smile/wms-encore'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit tests only. src/tests/modules/** are HTTP integration tests that
      # need a running API, Keycloak and seeded MySQL (see .env.test).
      - name: Run unit tests (core)
        run: pnpm --filter @smile/smile-core exec vitest run --config vitest.unit.config.ts

      - name: Run unit tests (main)
        run: pnpm --filter @smile/smile-main exec vitest run --config vitest.unit.config.ts


  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        # wms-encore is an Encore app built via `encore build docker` in its own
        # Build & Deploy workflow (build-deploy.yml) which installs the Encore CLI.
        # Skipping it here avoids `encore: not found` when `turbo build` reaches it.
        # core/main/warehouse `build` only regenerates Kysely types from a live
        # database; the generated db.d.ts files are committed. Build the
        # deployable web bundle (pulls in @repo/ui and docs through turbo).
        run: pnpm turbo build --filter=web

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # Gate on high/critical advisories in production dependencies (BA-723
    # brought these to zero via pnpm overrides).
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Run security audit
        run: pnpm audit --prod --audit-level high

  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    # Skip when SONAR_TOKEN hasn't been configured in repo secrets yet,
    # otherwise the scan fails at startup ("Not authorized / project not found").
    # `secrets` is not available in a job-level `if` (it made GitHub reject
    # the whole workflow, so no CI job ever started); gate the steps instead.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout code
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        if: env.SONAR_TOKEN != ''
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: env.SONAR_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        if: env.SONAR_TOKEN != ''
        run: pnpm test:coverage

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
