name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: smile-health/platform

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      core: ${{ steps.filter.outputs.core }}
      main: ${{ steps.filter.outputs.main }}
      notification: ${{ steps.filter.outputs.notification }}
      wms: ${{ steps.filter.outputs.wms }}
      web: ${{ steps.filter.outputs.web }}
      lib: ${{ steps.filter.outputs.lib }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'apps/auth-service/**'
            core:
              - 'apps/core/**'
            main:
              - 'apps/main/**'
            notification:
              - 'apps/notification/**'
            wms:
              - 'apps/wms-service/**'
            web:
              - 'apps/web/**'
            lib:
              - 'packages/lib/**'

  build:
    name: Build ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.changes.outputs.auth }}
            context: .
            dockerfile: apps/auth-service/Dockerfile
          - service: core
            changed: ${{ needs.changes.outputs.core }}
            context: .
            dockerfile: apps/core/Dockerfile
          - service: main
            changed: ${{ needs.changes.outputs.main }}
            context: .
            dockerfile: apps/main/Dockerfile
          - service: notification
            changed: ${{ needs.changes.outputs.notification }}
            context: .
            dockerfile: apps/notification/Dockerfile
          - service: wms-service
            changed: ${{ needs.changes.outputs.wms }}
            context: .
            dockerfile: apps/wms-service/Dockerfile
          - service: web
            changed: ${{ needs.changes.outputs.web }}
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Check if should build
        id: should_build
        run: |
          if [[ "${{ matrix.changed }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || 'Dockerfile' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to RKE
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Set up kubeconfig
        env:
          RKE_KUBECONFIG: ${{ secrets.RKE_KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$RKE_KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy via SSH to RKE
        env:
          RKE_SSH_HOST: ${{ secrets.RKE_SSH_HOST || '10.10.0.3' }}
          RKE_SSH_PORT: ${{ secrets.RKE_SSH_PORT || '60322' }}
          RKE_SSH_USER: ${{ secrets.RKE_SSH_USER || 'devel' }}
          RKE_SSH_PASSWORD: ${{ secrets.RKE_SSH_PASSWORD }}
        run: |
          SHA="${{ github.sha }}"
          
          # Build list of services to deploy
          DEPLOY_SERVICES=""
          if [[ "${{ needs.changes.outputs.auth }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            DEPLOY_SERVICES="$DEPLOY_SERVICES auth-service:smile-health-auth"
          fi
          if [[ "${{ needs.changes.outputs.core }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            DEPLOY_SERVICES="$DEPLOY_SERVICES core:smile-health-core"
          fi
          if [[ "${{ needs.changes.outputs.main }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            DEPLOY_SERVICES="$DEPLOY_SERVICES main:smile-health-main"
          fi
          if [[ "${{ needs.changes.outputs.notification }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            DEPLOY_SERVICES="$DEPLOY_SERVICES notification:smile-health-notification"
          fi
          if [[ "${{ needs.changes.outputs.wms }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            DEPLOY_SERVICES="$DEPLOY_SERVICES wms-service:smile-health-wms"
          fi
          if [[ "${{ needs.changes.outputs.web }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            DEPLOY_SERVICES="$DEPLOY_SERVICES web:smile-health-frontend"
          fi
          
          echo "Deploying services with SHA: $SHA"
          
          for entry in $DEPLOY_SERVICES; do
            svc=$(echo $entry | cut -d: -f1)
            deployment=$(echo $entry | cut -d: -f2)
            image="ghcr.io/smile-health/platform/${svc}:${SHA}"
            
            echo "→ Deploying $svc ($deployment) with image $image..."
            sshpass -p "$RKE_SSH_PASSWORD" ssh -p "$RKE_SSH_PORT" \
              -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              "$RKE_SSH_USER@$RKE_SSH_HOST" \
              "KUBECONFIG=/tmp/rke-badr-config.yaml kubectl set image deployment/$deployment -n smile-health smile-app=$image && echo '✅ $svc deployed'" || {
              echo "❌ Failed to deploy $svc"
              exit 1
            }
          done
          
          echo "✅ All services deployed successfully"
          
          # Wait for rollouts
          for entry in $DEPLOY_SERVICES; do
            deployment=$(echo $entry | cut -d: -f2)
            echo "→ Waiting for $deployment rollout..."
            sshpass -p "$RKE_SSH_PASSWORD" ssh -p "$RKE_SSH_PORT" \
              -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              "$RKE_SSH_USER@$RKE_SSH_HOST" \
              "KUBECONFIG=/tmp/rke-badr-config.yaml kubectl rollout status deployment/$deployment -n smile-health --timeout=180s" || {
              echo "❌ Rollout timeout for $deployment"
              exit 1
            }
            echo "✅ $deployment rollout complete"
          done