name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: smile-health/platform

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      core: ${{ steps.filter.outputs.core }}
      main: ${{ steps.filter.outputs.main }}
      notification: ${{ steps.filter.outputs.notification }}
      wms: ${{ steps.filter.outputs.wms }}
      web: ${{ steps.filter.outputs.web }}
      lib: ${{ steps.filter.outputs.lib }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'apps/auth-service/**'
            core:
              - 'apps/core/**'
            main:
              - 'apps/main/**'
            notification:
              - 'apps/notification/**'
            wms:
              - 'apps/wms-service/**'
            web:
              - 'apps/web/**'
            lib:
              - 'packages/lib/**'

  build:
    name: Build ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.changes.outputs.auth }}
            context: apps/auth-service
          - service: core
            changed: ${{ needs.changes.outputs.core }}
            context: apps/core
          - service: main
            changed: ${{ needs.changes.outputs.main }}
            context: apps/main
          - service: notification
            changed: ${{ needs.changes.outputs.notification }}
            context: apps/notification
          - service: wms-service
            changed: ${{ needs.changes.outputs.wms }}
            context: apps/wms-service
          - service: web
            changed: ${{ needs.changes.outputs.web }}
            context: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Check if should build
        id: should_build
        run: |
          if [[ "${{ matrix.changed }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to RKE
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      NAMESPACE: smile-health
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH tunnel to RKE
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.DEPLOY_SSH_PORT || 60322 }} -H ${{ secrets.DEPLOY_SSH_HOST }} >> $HOME/.ssh/known_hosts 2>/dev/null
          
          # Create SSH tunnel: local 6443 → jump server → RKE API server
          ssh -f -N -L 16443:10.10.0.10:6443 \
            -p ${{ secrets.DEPLOY_SSH_PORT || 60322 }} \
            ${{ secrets.DEPLOY_SSH_USER || 'devel' }}@${{ secrets.DEPLOY_SSH_HOST }} \
            -o StrictHostKeyChecking=no -o ServerAliveInterval=60
          
          # Wait for tunnel
          sleep 3
          nc -z 127.0.0.1 16443 && echo "Tunnel OK" || { echo "Tunnel FAILED"; exit 1; }

      - name: Setup kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.RKE_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          # Replace 10.10.0.10:6443 with localhost:16443 (tunneled)
          sed -i 's|10.10.0.10:6443|127.0.0.1:16443|g' $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl version --client 2>&1 | head -1
          kubectl get nodes 2>&1 | head -5

      - name: Deploy changed services
        run: |
          SHA="${{ github.sha }}"
          REGISTRY="ghcr.io/${{ env.REGISTRY_NAMESPACE }}"
          
          deploy_service() {
            local service="$1"
            local deployment="$2"
            local image="${REGISTRY}/${service}:${SHA}"
            
            echo "🔄 Deploying ${deployment} with image ${image}..."
            kubectl set image deployment/${deployment} smile-app=${image} -n ${NAMESPACE}
            kubectl rollout status deployment/${deployment} -n ${NAMESPACE} --timeout=180s
            echo "✅ ${deployment} deployed successfully"
          }
          
          if [[ "${{ needs.changes.outputs.auth }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            deploy_service "auth-service" "smile-health-auth"
          fi
          
          if [[ "${{ needs.changes.outputs.core }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            deploy_service "core" "smile-health-core"
          fi
          
          if [[ "${{ needs.changes.outputs.main }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            deploy_service "main" "smile-health-main"
          fi
          
          if [[ "${{ needs.changes.outputs.notification }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            deploy_service "notification" "smile-health-notification"
          fi
          
          if [[ "${{ needs.changes.outputs.wms }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            deploy_service "wms-service" "smile-health-wms"
          fi
          
          if [[ "${{ needs.changes.outputs.web }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            deploy_service "web" "smile-health-frontend"
          fi

      - name: Verify deployments
        run: |
          echo "📋 Deployment status:"
          kubectl get deployments -n ${NAMESPACE} -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas --no-headers | grep smile-health