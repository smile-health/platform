name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: smile-health/platform

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      core: ${{ steps.filter.outputs.core }}
      main: ${{ steps.filter.outputs.main }}
      notification: ${{ steps.filter.outputs.notification }}
      wms: ${{ steps.filter.outputs.wms }}
      web: ${{ steps.filter.outputs.web }}
      lib: ${{ steps.filter.outputs.lib }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'apps/auth-service/**'
            core:
              - 'apps/core/**'
            main:
              - 'apps/main/**'
            notification:
              - 'apps/notification/**'
            wms:
              - 'apps/wms-service/**'
            web:
              - 'apps/web/**'
            lib:
              - 'packages/lib/**'

  build:
    name: Build ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.changes.outputs.auth }}
            context: .
            dockerfile: apps/auth-service/Dockerfile
          - service: core
            changed: ${{ needs.changes.outputs.core }}
            context: .
            dockerfile: apps/core/Dockerfile
          - service: main
            changed: ${{ needs.changes.outputs.main }}
            context: .
            dockerfile: apps/main/Dockerfile
          - service: notification
            changed: ${{ needs.changes.outputs.notification }}
            context: apps/notification
            dockerfile: apps/notification/Dockerfile
          - service: wms-service
            changed: ${{ needs.changes.outputs.wms }}
            context: apps/wms-service
            dockerfile: apps/wms-service/Dockerfile
          - service: web
            changed: ${{ needs.changes.outputs.web }}
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Check if should build
        id: should_build
        run: |
          if [[ "${{ matrix.changed }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || 'Dockerfile' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to RKE
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://smile-deploy.badr.co.id/' }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'smile-deploy-webhook-2026' }}
        run: |
          SHA="${{ github.sha }}"
          
          # Build list of services to deploy
          SERVICES=""
          if [[ "${{ needs.changes.outputs.auth }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES auth-service"
          fi
          if [[ "${{ needs.changes.outputs.core }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES core"
          fi
          if [[ "${{ needs.changes.outputs.main }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES main"
          fi
          if [[ "${{ needs.changes.outputs.notification }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES notification"
          fi
          if [[ "${{ needs.changes.outputs.wms }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES wms-service"
          fi
          if [[ "${{ needs.changes.outputs.web }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES web"
          fi
          
          if [ -z "$SERVICES" ]; then
            echo "No services changed"
            exit 0
          fi
          
          echo "Deploying services: $SERVICES"
          echo "SHA: $SHA"
          
          # Convert space-separated services to JSON array
          JSON_SERVICES=$(echo "$SERVICES" | jq -R 'split(" ")')
          
          PAYLOAD=$(jq -n \
            --arg sha "$SHA" \
            --argjson services "$JSON_SERVICES" \
            --arg secret "$WEBHOOK_SECRET" \
            '{sha: $sha, services: $services, webhook_secret: $secret}')
          
          echo "Sending webhook payload..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Webhook deployment failed"
            exit 1
          fi
          
          echo "✅ All services deployed successfully"
          
          # Wait for rollouts
          for entry in $DEPLOY_SERVICES; do
            deployment=$(echo $entry | cut -d: -f2)
            echo "→ Waiting for $deployment rollout..."
            sshpass -p "$RKE_SSH_PASSWORD" ssh -p "$RKE_SSH_PORT" \
              -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              "$RKE_SSH_USER@$RKE_SSH_HOST" \
              "KUBECONFIG=/tmp/rke-badr-config.yaml kubectl rollout status deployment/$deployment -n smile-health --timeout=180s" || {
              echo "❌ Rollout timeout for $deployment"
              exit 1
            }
            echo "✅ $deployment rollout complete"
          done