name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build & deploy (comma-separated: auth,core,main,wms,wms-encore,web). Use "all" for every service.'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: smile-health/platform

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      core: ${{ steps.filter.outputs.core }}
      main: ${{ steps.filter.outputs.main }}
      wms: ${{ steps.filter.outputs.wms }}
      wms_encore: ${{ steps.filter.outputs.wms_encore }}
      web: ${{ steps.filter.outputs.web }}
      lib: ${{ steps.filter.outputs.lib }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'apps/auth-service/**'
            core:
              - 'apps/core/**'
            main:
              - 'apps/main/**'
            wms:
              - 'apps/wms-service/**'
            wms_encore:
              - 'apps/wms-encore/**'
            web:
              - 'apps/web/**'
            lib:
              - 'packages/lib/**'

  # ---- Per-service build jobs. Each is independent: a failure in one
  # service does NOT block the others. A service is skipped when neither
  # its own path nor packages/lib changed.
  build-auth:
    name: Build auth-service
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: needs.changes.outputs.auth == 'true' || needs.changes.outputs.lib == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'auth')))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/auth-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-core:
    name: Build core
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.lib == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'core')))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/core/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/core:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-main:
    name: Build main
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: needs.changes.outputs.main == 'true' || needs.changes.outputs.lib == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'main')))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/main/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/main:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/main:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-wms:
    name: Build wms-service
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: needs.changes.outputs.wms == 'true' || needs.changes.outputs.lib == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'wms')))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/wms-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/wms-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/wms-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-wms-encore:
    name: Build wms-encore
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
      contents: read
    if: needs.changes.outputs.wms_encore == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'wms-encore')))
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # kalau ini gagal, artinya pnpm-lock.yaml out-of-sync dengan
        # package.json — perbaiki lockfile-nya lokal, jangan di-bypass di CI

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Verify config exists
        working-directory: apps/wms-encore
        run: |
          ls -la encore.config.json
          cat encore.config.json

      - name: Build encore docker image
        working-directory: apps/wms-encore
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          encore build docker --config encore.config.json wms-encore:latest

      - name: Inspect embedded config
        run: |
          docker run --rm --entrypoint sh wms-encore:latest -c 'env | grep -i encore; find / -iname "*runtime-config*" -o -iname "*infra*" 2>/dev/null'

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image (sha)
        run: |
          docker tag wms-encore:latest ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/wms-encore:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/wms-encore:${{ github.sha }}

      - name: Tag and push image (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag wms-encore:latest ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/wms-encore:latest
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/wms-encore:latest

  build-web:
    name: Build web
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.lib == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'web')))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Per-service deploy jobs. Each only waits on ITS OWN build job, so
  # a failed build in one service does not block deploys of the others.
  # A deploy runs only when its build job actually ran (i.e. the service
  # changed) AND we're on main.
  deploy-auth:
    name: Deploy auth-service
    needs: [changes, build-auth]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build-auth.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://smile-deploy.badr.co.id/' }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'smile-deploy-webhook-2026' }}
        run: |
          SHA="${{ github.sha }}"
          SERVICES='["auth-service"]'
          PAYLOAD=$(jq -n --arg sha "$SHA" --argjson services "$SERVICES" --arg secret "$WEBHOOK_SECRET" '{sha: $sha, services: $services, webhook_secret: $secret}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then echo "❌ Webhook deployment failed"; exit 1; fi
          echo "✅ auth-service deployed"

  deploy-core:
    name: Deploy core
    needs: [changes, build-core]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build-core.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://smile-deploy.badr.co.id/' }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'smile-deploy-webhook-2026' }}
        run: |
          SHA="${{ github.sha }}"
          SERVICES='["core"]'
          PAYLOAD=$(jq -n --arg sha "$SHA" --argjson services "$SERVICES" --arg secret "$WEBHOOK_SECRET" '{sha: $sha, services: $services, webhook_secret: $secret}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then echo "❌ Webhook deployment failed"; exit 1; fi
          echo "✅ core deployed"

  deploy-main:
    name: Deploy main
    needs: [changes, build-main]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build-main.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://smile-deploy.badr.co.id/' }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'smile-deploy-webhook-2026' }}
        run: |
          SHA="${{ github.sha }}"
          SERVICES='["main"]'
          PAYLOAD=$(jq -n --arg sha "$SHA" --argjson services "$SERVICES" --arg secret "$WEBHOOK_SECRET" '{sha: $sha, services: $services, webhook_secret: $secret}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then echo "❌ Webhook deployment failed"; exit 1; fi
          echo "✅ main deployed"

  deploy-wms:
    name: Deploy wms-service
    needs: [changes, build-wms]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build-wms.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://smile-deploy.badr.co.id/' }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'smile-deploy-webhook-2026' }}
        run: |
          SHA="${{ github.sha }}"
          SERVICES='["wms-service"]'
          PAYLOAD=$(jq -n --arg sha "$SHA" --argjson services "$SERVICES" --arg secret "$WEBHOOK_SECRET" '{sha: $sha, services: $services, webhook_secret: $secret}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then echo "❌ Webhook deployment failed"; exit 1; fi
          echo "✅ wms-service deployed"

  deploy-wms-encore:
    name: Deploy wms-encore
    needs: [changes, build-wms-encore]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build-wms-encore.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://smile-deploy.badr.co.id/' }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'smile-deploy-webhook-2026' }}
        run: |
          SHA="${{ github.sha }}"
          SERVICES='["wms-encore"]'
          PAYLOAD=$(jq -n --arg sha "$SHA" --argjson services "$SERVICES" --arg secret "$WEBHOOK_SECRET" '{sha: $sha, services: $services, webhook_secret: $secret}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then echo "❌ Webhook deployment failed"; exit 1; fi
          echo "✅ wms-encore deployed"

  deploy-web:
    name: Deploy web
    needs: [changes, build-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build-web.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://smile-deploy.badr.co.id/' }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'smile-deploy-webhook-2026' }}
        run: |
          SHA="${{ github.sha }}"
          SERVICES='["web"]'
          PAYLOAD=$(jq -n --arg sha "$SHA" --argjson services "$SERVICES" --arg secret "$WEBHOOK_SECRET" '{sha: $sha, services: $services, webhook_secret: $secret}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then echo "❌ Webhook deployment failed"; exit 1; fi
          echo "✅ web deployed"
