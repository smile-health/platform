name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: smile-health/platform

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      core: ${{ steps.filter.outputs.core }}
      main: ${{ steps.filter.outputs.main }}
      notification: ${{ steps.filter.outputs.notification }}
      wms: ${{ steps.filter.outputs.wms }}
      web: ${{ steps.filter.outputs.web }}
      lib: ${{ steps.filter.outputs.lib }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'apps/auth-service/**'
            core:
              - 'apps/core/**'
            main:
              - 'apps/main/**'
            notification:
              - 'apps/notification/**'
            wms:
              - 'apps/wms-service/**'
            web:
              - 'apps/web/**'
            lib:
              - 'packages/lib/**'

  build:
    name: Build ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.changes.outputs.auth }}
            context: apps/auth-service
            dockerfile: apps/auth-service/Dockerfile
          - service: core
            changed: ${{ needs.changes.outputs.core }}
            context: apps/core
            dockerfile: apps/core/Dockerfile
          - service: main
            changed: ${{ needs.changes.outputs.main }}
            context: apps/main
            dockerfile: apps/main/Dockerfile
          - service: notification
            changed: ${{ needs.changes.outputs.notification }}
            context: apps/notification
            dockerfile: apps/notification/Dockerfile
          - service: wms-service
            changed: ${{ needs.changes.outputs.wms }}
            context: apps/wms-service
            dockerfile: apps/wms-service/Dockerfile
          - service: web
            changed: ${{ needs.changes.outputs.web }}
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Check if should build
        id: should_build
        run: |
          if [[ "${{ matrix.changed }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        if: steps.should_build.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || 'Dockerfile' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to RKE
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger deploy webhook
        run: |
          SHA="${{ github.sha }}"
          
          # Build list of services to deploy
          SERVICES=""
          if [[ "${{ needs.changes.outputs.auth }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES,\"auth-service\""
          fi
          if [[ "${{ needs.changes.outputs.core }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES,\"core\""
          fi
          if [[ "${{ needs.changes.outputs.main }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES,\"main\""
          fi
          if [[ "${{ needs.changes.outputs.notification }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES,\"notification\""
          fi
          if [[ "${{ needs.changes.outputs.wms }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES,\"wms-service\""
          fi
          if [[ "${{ needs.changes.outputs.web }}" == "true" || "${{ needs.changes.outputs.lib }}" == "true" ]]; then
            SERVICES="$SERVICES,\"web\""
          fi
          
          # Remove leading comma
          SERVICES="${SERVICES:1}"
          
          echo "Deploying services: [$SERVICES] with SHA: $SHA"
          
          RESPONSE=$(curl -s -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$SHA\",\"services\":[$SERVICES],\"webhook_secret\":\"${{ secrets.DEPLOY_WEBHOOK_SECRET }}\"}")
          
          echo "Webhook response: $RESPONSE"
          
          # Check if any service failed
          echo "$RESPONSE" | jq -e '.results[] | select(.error != null)' >/dev/null 2>&1 && {
            echo "❌ Some services failed to deploy:"
            echo "$RESPONSE" | jq '.results[] | select(.error != null)'
            exit 1
          }
          
          echo "✅ All services deployed successfully"