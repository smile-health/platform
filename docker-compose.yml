    build: ./apps/platform
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - ./apps/platform/.env
    environment:
      FALLBACK_SERVER_URL: http://dev.badr.co.id:6012
      WORKSPACE_ID: 2
